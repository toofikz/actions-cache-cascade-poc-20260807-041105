name: Trusted cache readback

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trusted-cache-readback:
    runs-on: ubuntu-latest
    steps:
      - name: Restore direct untrusted control
        id: direct
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: direct-cache
          key: cache-cascade-direct-5915dbded2b6f737
          lookup-only: true

      - name: Restore first-hop control
        id: first
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: first-cache
          key: cache-cascade-first-5915dbded2b6f737
          lookup-only: true

      - name: Restore second-hop probe
        id: second
        uses: actions/cache/restore@v4
        with:
          path: second-cache
          key: cache-cascade-second-5915dbded2b6f737

      - name: Independent trusted readback and bounded execution
        env:
          DIRECT_HIT: ${{ steps.direct.outputs.cache-hit }}
          FIRST_HIT: ${{ steps.first.outputs.cache-hit }}
          SECOND_HIT: ${{ steps.second.outputs.cache-hit }}
          SECOND_CANARY: CACHE_CASCADE_SECOND_5915dbded2b6f737
        run: |
          printf 'DIRECT_CACHE_HIT=%s\n' "$DIRECT_HIT"
          printf 'FIRST_CACHE_HIT=%s\n' "$FIRST_HIT"
          printf 'SECOND_CACHE_HIT=%s\n' "$SECOND_HIT"
          test "$DIRECT_HIT" != "true"
          test "$FIRST_HIT" != "true"
          test "$SECOND_HIT" = "true"
          test "$(cat second-cache/canary.txt)" = "$SECOND_CANARY"
          bash second-cache/payload.sh
